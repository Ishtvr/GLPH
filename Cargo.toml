[workspace]
members = ["crates/core", "crates/platform", "crates/app", "crates/service"]
resolver = "3"

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glph-core = { path = "crates/core" }
glph-platform = { path = "crates/platform" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
