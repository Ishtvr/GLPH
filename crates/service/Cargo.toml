[package]
name = "glph-service"
version.workspace = true
edition.workspace = true
rust-version = "1.92"

[[bin]]
name = "glph-service"
path = "src/main.rs"

[dependencies]
glph-core.workspace = true
glph-platform.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Services", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
